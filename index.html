<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Biwlu</title>
    <style>
      :root { --bg: #ffe14d; --ink: #111111; --card: #ffffff; --red: #d93d1a; }
      body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.55 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      main { max-width: 680px; margin: 48px auto; padding: 0 16px; }
      h1 { font-size: 40px; margin: 0 0 8px; letter-spacing: -1px; }
      h1 span { color: var(--red); }
      .card { background: var(--card); border: 3px solid var(--ink); border-radius: 18px; box-shadow: 6px 6px 0 var(--ink); padding: 20px 24px; margin-top: 24px; }
      h2 { margin: 0 0 4px; font-size: 22px; }
      a { color: var(--ink); font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <h1>biwlu<span>.</span></h1>
      <p>Apps pequenos e caprichados. / Small, carefully made apps.</p>
      <section class="card">
        <h2>Duckie</h2>
        <p>Uma pergunta por dia. Daqui a um ano, ela volta. / One question a day. A year from now, it comes back.</p>
        <p><a href="duckie/privacidade/">Privacidade / Privacy</a></p>
      </section>
    </main>
  </body>
</html>
